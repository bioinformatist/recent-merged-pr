name: Recent Merged PR
description: Show recent merged pull requests from external repositories in a README.
author: bioinformatist

inputs:
  token:
    description: Personal access token representing the profile owner.
    required: true
  readme-path:
    description: README path to update when output-only is false.
    required: false
    default: README.md
  repo-limit:
    description: Number of repositories to display after filtering and sorting.
    required: false
    default: "6"
  max-prs-per-repo:
    description: Maximum number of pull requests to show under each repository.
    required: false
    default: "3"
  lookback-days:
    description: Only consider pull requests merged within this many days.
    required: false
    default: "365"
  marker-start:
    description: Start marker for the generated README block.
    required: false
    default: "<!-- RECENT_PRS_START -->"
  marker-end:
    description: End marker for the generated README block.
    required: false
    default: "<!-- RECENT_PRS_END -->"
  include-private:
    description: Include private repositories in the generated list.
    required: false
    default: "false"
  output-only:
    description: Print and expose generated Markdown without editing the README.
    required: false
    default: "false"

outputs:
  markdown:
    description: Generated Markdown block. Set when output-only is true.

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Run recent-merged-pr
      shell: bash
      env:
        RECENT_MERGED_PR_TOKEN: ${{ inputs.token }}
        INPUT_README_PATH: ${{ inputs.readme-path }}
        INPUT_REPO_LIMIT: ${{ inputs.repo-limit }}
        INPUT_MAX_PRS_PER_REPO: ${{ inputs.max-prs-per-repo }}
        INPUT_LOOKBACK_DAYS: ${{ inputs.lookback-days }}
        INPUT_MARKER_START: ${{ inputs.marker-start }}
        INPUT_MARKER_END: ${{ inputs.marker-end }}
        INPUT_INCLUDE_PRIVATE: ${{ inputs.include-private }}
        INPUT_OUTPUT_ONLY: ${{ inputs.output-only }}
      run: cargo run --release --manifest-path "${{ github.action_path }}/Cargo.toml"

branding:
  icon: git-pull-request
  color: orange
