<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Recent Merged PR social preview</title>
  <desc id="desc">A GitHub social preview showing repository-grouped merged pull requests rendered as Markdown tree output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.56" stop-color="#111827"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M72 500 C226 420 312 556 454 478 S690 506 820 408 S1044 470 1190 352" fill="none" stroke="#2dd4bf" stroke-opacity="0.15" stroke-width="2"/>
  <path d="M98 546 C260 464 364 604 508 524 S760 548 912 444 S1086 492 1210 396" fill="none" stroke="#f97316" stroke-opacity="0.17" stroke-width="2"/>

  <g transform="translate(74 76)">
    <rect x="0" y="0" width="122" height="32" rx="16" fill="#1f2937" stroke="#30363d"/>
    <text x="61" y="22" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2dd4bf">GitHub Action</text>

    <text x="0" y="94" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="0" fill="#f0f6fc">Recent Merged PR</text>
    <text x="0" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="500" fill="#c9d1d9">Readable README output for clustered PRs.</text>

    <g transform="translate(0 198)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
      <g>
        <circle cx="14" cy="13" r="8" fill="#238636"/>
        <path d="M10 13.5l3.2 3.2L19 9.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="20" font-size="22" font-weight="700" fill="#f0f6fc">Group repeated PRs by repository</text>
      </g>
      <g transform="translate(0 56)">
        <circle cx="14" cy="13" r="8" fill="#238636"/>
        <path d="M10 13.5l3.2 3.2L19 9.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="20" font-size="22" font-weight="700" fill="#f0f6fc">Limit repos and PRs per repo separately</text>
      </g>
      <g transform="translate(0 112)">
        <circle cx="14" cy="13" r="8" fill="#238636"/>
        <path d="M10 13.5l3.2 3.2L19 9.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="20" font-size="22" font-weight="700" fill="#f0f6fc">Add a more link for dense histories</text>
      </g>
      <g transform="translate(0 168)">
        <circle cx="14" cy="13" r="8" fill="#238636"/>
        <path d="M10 13.5l3.2 3.2L19 9.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="20" font-size="22" font-weight="700" fill="#f0f6fc">Runs from a prebuilt Linux x64 binary</text>
      </g>
    </g>

    <g transform="translate(0 444)">
      <rect x="0" y="0" width="430" height="48" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="20" y="31" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="18" fill="#f97316">repo-limit</text>
      <text x="126" y="31" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="18" fill="#8b949e">=6</text>
      <text x="168" y="31" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="18" fill="#30363d">|</text>
      <text x="194" y="31" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="18" fill="#2dd4bf">max-prs-per-repo</text>
      <text x="376" y="31" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="18" fill="#8b949e">=3</text>
    </g>
  </g>

  <g transform="translate(704 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="500" height="500" rx="12" fill="url(#panel)"/>
    <rect x="0" y="0" width="500" height="58" rx="12" fill="#ffffff"/>
    <path d="M0 58H500" stroke="#d0d7de"/>
    <text x="26" y="37" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800" fill="#24292f">Recent Merged Pull Requests</text>

    <g transform="translate(28 96)" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="18">
      <circle cx="7" cy="7" r="3.2" fill="#24292f"/>
      <text x="22" y="13" fill="#0969da" text-decoration="underline">luccahuguet/yazelix</text>

      <text x="22" y="47" fill="#57606a">|--</text>
      <text x="68" y="47" fill="#0969da" text-decoration="underline">#612</text>
      <text x="122" y="47" fill="#24292f">fix: enter startup cwd</text>

      <text x="22" y="78" fill="#57606a">|--</text>
      <text x="68" y="78" fill="#0969da" text-decoration="underline">#605</text>
      <text x="122" y="78" fill="#24292f">chore: add prek shell</text>

      <text x="22" y="109" fill="#57606a">|--</text>
      <text x="68" y="109" fill="#0969da" text-decoration="underline">#603</text>
      <text x="122" y="109" fill="#24292f">Improve tutor</text>

      <text x="22" y="140" fill="#57606a">'--</text>
      <text x="68" y="140" fill="#0969da" text-decoration="underline">more...</text>

      <circle cx="7" cy="181" r="3.2" fill="#24292f"/>
      <text x="22" y="187" fill="#0969da" text-decoration="underline">amruthpillai/reactive-resume#3095</text>
      <text x="22" y="218" fill="#24292f">fix(auth): migrated social logins</text>

      <circle cx="7" cy="259" r="3.2" fill="#24292f"/>
      <text x="22" y="265" fill="#0969da" text-decoration="underline">SYSU-SCC/sysu-thesis</text>

      <text x="22" y="299" fill="#57606a">|--</text>
      <text x="68" y="299" fill="#0969da" text-decoration="underline">#118</text>
      <text x="122" y="299" fill="#24292f">Makefile docs</text>

      <text x="22" y="330" fill="#57606a">'--</text>
      <text x="68" y="330" fill="#0969da" text-decoration="underline">#117</text>
      <text x="122" y="330" fill="#24292f">Dockerfile cleanup</text>

    </g>

    <text x="28" y="456" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-style="italic" fill="#57606a">Last updated from GitHub Actions</text>
  </g>
</svg>
